<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Biblioteca de Catalyst · Lectura Crítica</title>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef7;--card:#fff;--card2:#f0f1fa;--ink:#262944;--mute:#5a6082;--gold:#946f00;--line:#cdd1e8;--ok:#1b7f4d;--bad:#c1304a;--okbg:#dff3e8;--badbg:#fbe3e8;--btn:#ebc52f;--btnink:#262944;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1f35;--card:#333652;--card2:#2a2d48;--ink:#f6f3ea;--mute:#b8bcd8;--gold:#ebc52f;--line:#4b5079;--ok:#7bd6a0;--bad:#f58a9b;--okbg:#274a45;--badbg:#573446}}
:root[data-theme="dark"]{--bg:#1c1f35;--card:#333652;--card2:#2a2d48;--ink:#f6f3ea;--mute:#b8bcd8;--gold:#ebc52f;--line:#4b5079;--ok:#7bd6a0;--bad:#f58a9b;--okbg:#274a45;--badbg:#573446}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) repeating-linear-gradient(0deg,transparent 0 158px,rgba(235,197,47,.08) 158px 160px);color:var(--ink);font:400 16px/1.55 Lexend,system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1,h2{font-family:Alegreya,Georgia,serif;line-height:1.1;margin:.2em 0 .3em}
h1{font-size:2.3rem;font-weight:800}h2{font-size:1.7rem;font-weight:700}
.mute{color:var(--mute);font-size:.9rem;margin:0 0 12px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 12px}
header img{width:44px;height:44px}
.hud{display:flex;gap:8px;font-size:.85rem;font-weight:500}
.hud span{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:600 1rem Lexend,sans-serif;background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:13px 16px;margin:10px 0 0;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--gold)}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.say{display:flex;gap:10px;align-items:flex-end;margin:12px 0}
.say img{width:56px;flex:none}
.say p{background:var(--card2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 14px;margin:0;font-size:.93rem}
.say.ok p{background:var(--okbg);border-color:var(--ok)}
.cover{text-align:center;padding-top:8px}
.cover .logo{width:132px;height:132px;border-radius:50%;border:3px solid var(--gold);margin:6px auto 10px}
.cover .say{text-align:left}
input{width:100%;font:500 1rem Lexend,sans-serif;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:6px}
.shelf{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-bottom:6px solid #8a4b22;border-radius:14px 14px 4px 4px;padding:12px 14px 12px;margin:0 0 14px;cursor:pointer;font-family:inherit}
.shelf b{display:block;font:700 1.2rem Alegreya,serif}.shelf small{color:var(--mute)}
.shelf.open{border-color:var(--gold);border-bottom-color:#8a4b22}
.shelf.lock{opacity:.5;cursor:default}.shelf.done small{color:var(--ok)}
.spines{display:flex;gap:3px;align-items:flex-end;height:30px;margin-bottom:6px}
.spines i{width:13px;border-radius:2px 2px 0 0;background:#8a4b22}
.door{display:block;margin:22px auto 0;background:none;border:0;color:var(--ink);font-family:inherit;text-align:center;cursor:pointer}
.arch{width:150px;height:170px;margin:0 auto 6px;border:5px solid var(--gold);border-bottom:0;border-radius:75px 75px 0 0;background:#8a4b22;display:flex;gap:12px;justify-content:center;align-items:center}
.kh{width:20px;height:20px;border-radius:50%;background:#2b1a0d;border:2px solid #4a2c14}
.kh.on{background:var(--gold);border-color:#fff;box-shadow:0 0 12px var(--gold)}
.door small{display:block;color:var(--mute)}
.dots{display:flex;gap:6px;margin-bottom:10px}.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--ok)}.dots i.cur{background:var(--gold)}
.q{font:700 1.25rem/1.25 Alegreya,serif;margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;font:400 .95rem Lexend,sans-serif;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:11px 13px;margin:0 0 8px;cursor:pointer}
.opt.good,.pair.ok,.chip.good{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg);opacity:.75}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair{font:400 .84rem/1.35 Lexend,sans-serif;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:9px;cursor:pointer;text-align:left}
.pair.pick{border-color:var(--gold);background:var(--card)}
.slots{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.slot{min-height:42px;border:2px dashed var(--line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;font-size:.92rem;background:transparent;color:var(--ink);font-family:inherit;text-align:left;cursor:pointer}
.slot.f{border-style:solid;border-color:var(--gold);background:var(--card2)}.slot em{color:var(--gold);font-style:normal;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .9rem Lexend,sans-serif;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
.keyscr,.end{text-align:center;padding-top:14px}
.key{font-size:5rem;animation:pop .8s ease-out;filter:drop-shadow(0 0 18px var(--gold))}
.end img{width:180px}.stars{font-size:2.4rem;color:var(--gold);letter-spacing:6px}
.shake{animation:sh .35s}
.rl{font-size:.88rem;color:var(--mute);margin:6px 0 0}.rl a{color:var(--gold)}
footer{text-align:center;color:var(--mute);font-size:.78rem;margin-top:26px}
.dev{background:var(--card2);border:1px dashed var(--gold);border-radius:12px;padding:8px 10px;margin:0 0 12px}.dev>b{display:block;font-size:.8rem;color:var(--gold);margin-bottom:6px}
.dev .row{flex-wrap:wrap;gap:6px}.dv{font:500 .8rem Lexend,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--gold);border-radius:8px;padding:6px 10px;cursor:pointer}
.tl{background:none;border:0;color:var(--mute);font:400 .78rem Lexend,sans-serif;text-decoration:underline;cursor:pointer;margin-left:8px}
.ans{border:2px solid var(--ok);background:var(--okbg);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.88rem}.ans b{color:var(--ok)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}summary{font-weight:600;cursor:pointer}
.ky{border-top:1px solid var(--line);margin-top:8px;padding-top:8px;font-size:.86rem}.ky p{margin:2px 0}.ky small{color:var(--mute)}
@keyframes pop{0%{transform:scale(.2) rotate(-40deg);opacity:0}70%{transform:scale(1.2) rotate(8deg)}100%{transform:none;opacity:1}}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.key,.shake{animation:none}}
</style></head><body>

tip:"En una historieta importa quién habla en cada viñeta y qué hace. Antes de interpretar, asegúrate de haber leído todo.",
ch:[
{t:"match",q:"¿Quién dice cada frase? Toca una frase y luego a su personaje.",pairs:[["«¡Tú no eres muy esponjosa!»","Nube de la izquierda"],["«Es que es el Océano Pacífico.»","Nube de la derecha"],["«¡NO LO HAGAN!»","El Océano Pacífico, en voz en off"]],why:"En la historieta solo hay tres voces: las dos nubes y el océano, que a veces interviene en voz en off. Saber quién dice qué evita confundirlas.",hint:"Solo hay tres personajes. Uno de ellos habla desde fuera de la viñeta."},
{t:"mc",q:"¿Qué le reprocha una nube a la otra?",o:["Que no es esponjosa y los humanos no le ven forma", "Que se burla del océano delante de los humanos", "Que ocupa más espacio en el cielo que las demás", "Que los humanos la persiguen y ella no se defiende"],a:0,why:"Lo dice la nube de la izquierda en la primera viñeta: no es esponjosa y los humanos la ven sin forma.",hint:"Todo se dice en la primera viñeta."},
{t:"mc",q:"¿Qué afirmación se puede comprobar directamente en la historieta?",o:["El océano es más sabio que las dos nubes juntas", "El océano les pide a las nubes que no peleen", "Las nubes llevan mucho tiempo peleando entre ellas", "Los humanos provocan la pelea al mirar el cielo"],a:1,why:"Solo la tercera ocurre en el mural. Las demás son interpretaciones o suposiciones, que trabajarás en las otras salas.",hint:"Descarta lo que sea una opinión o algo que ni se dibuja ni se dice."}]},
{title:"El pergamino de las cuatro cumbres",sub:"El último estante clasifica volcanes.",key:"Llave de la Cumbre",link:NG,ll:"Volver al artículo",
mission:"El último pergamino clasifica los volcanes. Regresa al artículo y busca la sección «Cuántos tipos de volcanes hay».",
tip:"Leer «grande» no es lo mismo que leer «alto». Los detalles pequeños separan una respuesta buena de una excelente.",
ch:[
{t:"match",q:"Une cada tipo de volcán con su rasgo.",pairs:[["Cono de escoria","Pequeño y cónico; el Paricutín nació en un maizal"],["Estratovolcán","Capas de lava endurecida; el Monte Fuji"],["Volcán en escudo","Lava fluida y poca pendiente; el Mauna Loa"],["Domo de lava","Lava tan espesa que no fluye; el Merapi"]],why:"Cada tipo se define por su forma y por el comportamiento de su lava, y el texto da un ejemplo de cada uno.",hint:"Los nombres dan pistas: «escudo» se parece a un escudo, «domo» a una cúpula."},
{t:"mc",q:"¿Cuál es el volcán más alto del planeta según el texto?",o:["Teide, en las islas Canarias, España", "Mauna Loa, en el archipiélago de Hawái", "Monte Fuji, en el territorio de Japón", "Nevado Ojos del Salado, en Chile"],a:3,why:"Con 6.960 metros sobre el nivel del mar. El Mauna Loa se menciona como el volcán activo más grande: es un dato distinto.",hint:"Busca una cifra en metros sobre el nivel del mar."}]}]},

{n:"La Galería de las Conexiones",c:"Competencia 2: comprender cómo se articulan las partes de un texto para darle un sentido global.",
say:"Subimos de piso. Aquí no basta con entender cada parte: hay que descubrir cómo encajan entre sí para formar un sentido completo.",
pz:[
{title:"El laberinto de Asterión",sub:"Un cuento de Borges guarda la primera llave.",key:"Llave del Laberinto",link:"https://www.icesi.edu.co/blogs/lenguajevirtual/files/2008/08/la-casa-de-asterion-borges.PDF",ll:"Abrir «La casa de Asterión» (PDF)",
mission:"Lee el cuento completo, es corto. Presta atención a quién habla, a lo que defiende y a cómo termina.",
tip:"Pregúntate qué función cumple cada parte: ¿por qué el autor pone esto aquí y no en otro lugar?",
ch:[
{t:"mc",q:"¿Qué función cumple la breve conversación final entre Teseo y Ariadna?",o:["Confirma que Asterión estaba loco, como lo acusaban al comienzo", "Revela que Asterión es el minotauro y que Teseo lo mató", "Presenta a Teseo como protagonista de una segunda historia nueva", "Muestra que Ariadna ayudó a Asterión a escapar del laberinto"],a:1,why:"Las últimas líneas cambian el punto de vista: de golpe sabemos quién narraba y qué le pasó. Esa parte da sentido global a todo el cuento.",hint:"Piensa en cómo cambiaría tu lectura si el cuento terminara una línea antes."},
{t:"mc",q:"Asterión insiste en que sus puertas están abiertas y no hay cerraduras. ¿Qué función cumple esa insistencia?",o:["Describe con precisión la arquitectura del palacio real", "Invita al lector a entrar y recorrer la casa sin miedo", "Se defiende de quienes lo acusan de ser un prisionero", "Prepara la revelación de que nunca aprendió a leer"],a:2,why:"Esa defensa conecta con la acusación del primer párrafo y, junto con las «puertas infinitas», anticipa que la casa es un laberinto.",hint:"Busca qué dicen de él quienes lo acusan."},
{t:"order",q:"Ordena los momentos del cuento según aparecen.",items:["Rechaza las acusaciones de soberbia y locura","Describe sus juegos, entre ellos el del «otro Asterión»","Reflexiona sobre la casa que es «el mundo»","Cuenta quiénes llegan cada nueve años y sueña con su redentor","Teseo le habla a Ariadna"],why:"El cuento va de la defensa a la intimidad del personaje, luego a su visión del mundo, a los visitantes y, al final, al golpe de otra voz.",hint:"Empieza y termina con una voz distinta."}]},
{title:"La aldea de Macondo",sub:"Un fragmento de García Márquez guarda la segunda llave.",key:"Llave del Hielo",link:"https://www.epdlp.com/texto.php?id2=557",ll:"Abrir el fragmento de Cien años de soledad",
mission:"Lee el fragmento completo. Está hecho de pedazos separados por «(...)»: tu tarea es ver cómo se conectan.",
tip:"Los textos pueden mezclar tiempos: un presente, un futuro que se anuncia y un pasado que se recuerda. Ubica cada uno.",
ch:[
{t:"mc",q:"La primera frase habla del coronel frente al pelotón y de una tarde remota. ¿Qué efecto tiene en la estructura del texto?",o:["Anuncia un hecho futuro y regresa a un recuerdo remoto", "Cuenta de forma cronológica la vida completa del coronel", "Anticipa el final de la novela para eliminar el suspenso", "Presenta al narrador como un habitante de la aldea"],a:0,why:"«Muchos años después» anuncia el futuro y de inmediato salta al pasado remoto. Esa mezcla de tiempos es una forma de organizar el texto.",hint:"Fíjate en la expresión «Muchos años después» y en la «tarde remota»."},
{t:"match",q:"Une cada momento de Macondo con su descripción.",pairs:[["Macondo al principio","Veinte casas de barro junto a un río; muchas cosas sin nombre"],["Macondo ordenado por José Arcadio","Aldea laboriosa y feliz donde nadie había muerto"],["Macondo al final","Lugar olvidado, de polvo y hormigas, con solo dos seres felices"]],why:"El fragmento recorre tres etapas del lugar. Verlas en conjunto es entender cómo se articula el texto.",hint:"Ubica las palabras «aldea», «ordenada» y «olvidado» en cada pedazo."},
{t:"mc",q:"¿Qué relación hay entre la aldea feliz y ordenada y el Macondo final, polvoriento y olvidado?",o:["Una repetición: las dos descripciones pintan la misma aldea", "Un cambio de opinión del narrador sobre sus habitantes", "Una comparación entre Macondo y otra aldea de la región", "Un contraste que muestra el paso del orden a la decadencia"],a:3,why:"El contraste entre el origen y el final construye una idea de conjunto: el auge y la caída de Macondo.",hint:"Compara cómo describe el texto el primer y el último Macondo."}]},
{title:"El gato y la luna",sub:"Un corto animado guarda la tercera llave.",key:"Llave de la Luna",link:"https://youtu.be/vh2vL4ldrT4?si=tlAaIt-oGMeUgu4L",ll:"Ver el video «El gato y la luna»",
mission:"Mira el video completo con atención a la narración. Después responde: el relato cambia de tiempo y de actitud, y debes seguirle el rastro.",
tip:"En un relato, el orden en que se cuenta no siempre es el orden en que ocurrió. Distingue el presente del narrador de lo que recuerda.",
ch:[
{t:"order",q:"Ordena las etapas de la historia del gato, desde que conoce la luna.",items:["Aparece la luna y su vida cambia","La sigue navegando mares y cruzando océanos","Se instala cómodo, pero ella lo vuelve a dejar","Corre tras ella saltando de techo en techo","Deja de correr y decide esperar"],why:"La historia pasa de la fascinación a la persecución, luego a un intento de estabilidad, otra persecución y finalmente la espera.",hint:"Busca las frases «Empecé a seguirla» y «Con el tiempo ya no corrí más»."},
{t:"mc",q:"El relato empieza y termina con la idea de esperar. ¿Qué efecto produce esa estructura?",o:["Un relato cronológico que avanza sin saltos hasta el final", "Un final que contradice el comienzo al dejar de esperar", "Un presente de espera que enmarca un recuerdo de búsqueda", "Dos historias paralelas que nunca llegan a cruzarse del todo"],a:2,why:"El narrador habla desde un presente de espera, recuerda el pasado de persecución y vuelve a ese presente al final. Esa estructura da sentido al todo.",hint:"Fíjate en la frase «Pero no siempre fue así»: marca un salto al pasado."},
{t:"mc",q:"¿Qué función cumple el paso de «correr tras ella» a «solo esperar»?",o:["Olvida a la luna y empieza una vida completamente distinta", "Pasa de perseguir con pasión a esperar con resignación", "La luna deja de aparecer y el gato pierde su objetivo", "Descubre que la luna nunca quiso ser alcanzada por él"],a:1,why:"Ese cambio resume el recorrido emocional del personaje y conecta la persecución del pasado con la espera del presente.",hint:"Compara cómo se siente al inicio de la persecución y al final."}]},
{title:"El gran cuadro de Kant",sub:"Un fragmento filosófico guarda la cuarta llave.",key:"Llave del Cuadro",link:"https://www.epdlp.com/texto.php?id2=12547",ll:"Abrir «Lo bello y lo sublime»",
mission:"Es un solo párrafo, denso pero ordenado. Léelo despacio y fíjate en cómo cada grupo de personas es presentado y cómo todos se juntan al final.",
tip:"En textos densos, busca cómo las partes se suman: ¿cuál es la idea que reúne todos los ejemplos?",
ch:[
{t:"match",q:"Une cada grupo de personas con su papel en el conjunto.",pairs:[["Los que obran según principios","Son muy pocos, y conviene: un principio equivocado causa un daño amplio"],["Los que obran por bondad espontánea","Son más; sus instintos cumplen el propósito de la naturaleza"],["Los que giran en torno a su egoísmo","Son los más; dan firmeza al todo y preparan las bases"],["El deseo de honor","Está en todos y da belleza al conjunto, aunque es una quimera si manda sobre todo"]],why:"Cada grupo tiene una función y el autor las va sumando. Así se arma la idea general del texto.",hint:"Para cada grupo, busca la palabra «son» y la cantidad: pocos, más, los más."},
{t:"mc",q:"¿Qué idea global articula las partes del fragmento?",o:["Los motivos humanos, aun opuestos, forman un conjunto armónico", "Los motivos nobles deben imponerse sobre los motivos egoístas", "La naturaleza humana es débil y debe ser corregida con principios", "El deseo de honor es el único motivo que merece elogio"],a:0,why:"El autor termina diciendo que los grupos se unen en un «cuadro» donde la unidad se ve a través de la diversidad.",hint:"Lee las últimas líneas: allí se reúnen todas las ideas."},
{t:"mc",q:"¿Por qué el autor considera conveniente que sean pocos los que obran según principios?",o:["Porque los principios son inútiles frente a los instintos", "Porque la bondad espontánea garantiza siempre el buen obrar", "Porque el honor es mejor guía que cualquier principio", "Porque un principio erróneo daña más cuanto más general es"],a:3,why:"Es una relación causa–consecuencia que el texto explica: pocos con principios limita el daño de un principio equivocado.",hint:"Busca la palabra «daño» en el fragmento."}]}]},

{n:"El Tribunal de los Críticos",c:"Competencia 3: reflexionar a partir de un texto y evaluar su contenido.",
say:"Último piso. Ahora no solo leemos: preguntamos quién habla, qué busca y si lo que dice se sostiene.",
pz:[
{title:"La escena del discurso",sub:"Un video de Rebelión en la granja guarda la primera llave.",key:"Llave del Discurso",link:"https://youtu.be/ylhQTN3aq00?feature=shared",ll:"Ver la escena de Rebelión en la granja",
mission:"Mira la escena completa. Fíjate en cómo el cerdo habla, en lo que promete y en cómo termina todo.",
tip:"Evaluar es preguntar con qué recursos se intenta convencer y si las razones se sostienen.",
ch:[
{t:"mc",q:"¿Qué estrategia usa el cerdo para convencer a los animales?",o:["Respalda su plan con cifras y estudios sobre electricidad", "Amenaza con castigos a los animales que se oponen", "Admite el costo inicial y lo compensa con promesas", "Se disculpa por errores del pasado para ganar confianza"],a:2,why:"Admite el costo («trabajar más y comer menos») y lo equilibra con promesas de luz, calor y esperanza. Es un recurso de persuasión.",hint:"Escucha qué menciona primero y qué promete después."},
{t:"mc",q:"El cerdo rebaja la semana de cuatro días a tres y luego a un día. ¿Qué efecto tiene en la credibilidad de su discurso?",o:["Sus promesas cambian según el aplauso, no según un plan", "Su plan está calculado al detalle y se ajusta con cuidado", "Demuestra honestidad al corregirse ante los animales", "Confirma que su rival tiene razón en todo lo que dice"],a:0,why:"Una promesa que cambia solo para agradar no se apoya en un plan real. Evaluar un discurso es notar esas incoherencias.",hint:"Observa qué provoca cada cambio en las promesas."},
{t:"mc",q:"Al final, el otro cerdo no responde con argumentos: alerta a los perros. ¿Qué crítica sugiere la escena?",o:["Que los cerdos se protegen entre sí frente a los perros", "Que la electricidad pone en riesgo a toda la granja", "Que los perros solo obedecen a quienes ganaron el voto", "Que el poder responde con fuerza a quien lo desafía"],a:3,why:"Un texto crítico se evalúa también por lo que dice entre líneas: aquí, que el poder reprime en vez de debatir.",hint:"Piensa en lo que hace el otro cerdo en lugar de refutar."}]},
{title:"La columna del editor",sub:"Un editorial de El Espectador guarda la segunda llave.",key:"Llave de la Opinión",link:"https://www.elespectador.com/opinion/editorial/atrapados-en-un-miedo-injustificado-a-la-marihuana/",ll:"Abrir el editorial",
mission:"Lee el editorial completo. Pregúntate qué defiende, con qué argumentos y qué voz le habla al lector.",
tip:"Un editorial es un texto de opinión: expresa la postura de un medio. Evalúalo con otras fuentes y datos.",
ch:[
{t:"mc",q:"¿Cuál es la postura del editorial?",o:["Rechaza regularla por los riesgos que implica para menores", "Defiende regularla y critica la inacción del Congreso", "Informa sobre el debate legislativo sin tomar posición", "Pide endurecer las sanciones por portar la dosis mínima"],a:1,why:"Lo dice desde el título hasta el cierre: la regulación tiene sentido financiero y de libertades individuales.",hint:"Observa quién queda mal parado: ¿el Gobierno o el Congreso?"},
{t:"mc",q:"El editorial señala que una persona puede consumir su dosis mínima legalmente, pero no tiene cómo conseguirla sin delinquir. ¿Qué tipo de argumento es?",o:["Un testimonio personal de alguien que consume marihuana", "Una cita de un experto sobre los efectos en la salud", "Una contradicción dentro de la norma que hoy rige", "Una analogía con la prohibición del alcohol en el pasado"],a:2,why:"Señala una incoherencia normativa. Evaluarlo implica preguntar si es cierta y si basta para defender la regulación.",hint:"Piensa en la palabra «incoherencias» del primer párrafo."},
{t:"mc",q:"Al ser un editorial, ¿qué debe tener en cuenta un lector crítico?",o:["Expresa una postura y debe contrastarse con otras fuentes", "Informa hechos sin opinión, así que basta con confiar en él", "Lo firma un especialista, por lo que no admite discusión", "Busca entretener al lector, por lo que sus datos no importan"],a:0,why:"El género importa: un editorial persuade desde una posición. Contrastar fuentes es parte de evaluar.",hint:"Piensa en la diferencia entre noticia y opinión."}]},
{title:"El espejo roto",sub:"Una caricatura guarda la última llave.",key:"Llave del Espejo",link:"https://www.instagram.com/p/DZCtl9TlvJr/?cplk=dWluemV2em40NGV3",ll:"Abrir la caricatura",
mission:"Observa la caricatura con calma: personajes, gestos, lo que dicen y lo que se calla. Luego responde.",
tip:"Una caricatura critica sin explicar: lee los símbolos, evalúa qué defiende y decide si su crítica es justa.",
ch:[
{t:"mc",q:"¿Cuál es la idea central de la caricatura?",o:["Un bando acierta mientras el otro manipula a la sociedad", "Dos bandos rivales usan el mismo miedo para dividir", "La sociedad se une cuando enfrenta una amenaza común", "Los debates complejos se resuelven con voluntad política"],a:1,why:"La polarización reduce debates complejos a miedo y urgencia, y los bandos funcionan como espejos con la misma lógica.",hint:"Piensa en qué hacen los dos bandos, no en lo que dicen de sí mismos."},
{t:"mc",q:"¿Cuál de estas ideas NO se puede sostener a partir de la caricatura?",o:["El miedo funciona como herramienta de cohesión social", "Los debates complejos se reducen a narrativas simples", "La polarización profundiza la división de la sociedad", "Uno de los bandos es más honesto que el otro"],a:3,why:"La caricatura muestra a los dos bandos como espejos: ninguno actúa con más honestidad que el otro.",hint:"Busca la opción que tome partido por un bando."},
{t:"mc",q:"¿Con cuál situación se relaciona mejor?",o:["Dos candidatos que pactan una alianza para gobernar juntos", "Dos expertos que debaten con datos sobre una reforma", "Dos campañas que se pintan como enemigas y usan el miedo", "Dos vecinos que discuten por el ruido de una fiesta"],a:2,why:"Reflexionar es llevar la idea del texto a otros contextos: aquí, a la política polarizada.",hint:"Busca el caso en que dos partes se acusan con miedo."}]}]}
];

let S,ch={},shk=false;const A=document.getElementById("app");

const PH="6e2aeb41d64bbbbd9f2c24fe57797f64a947923dce618bd989e869aeb6886300";
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(x=>x.toString(16).padStart(2,"0")).join("");

${say(IMG.bu,"Soy Clarín, el guardián de esta biblioteca. Lleva cien años cerrada: los libros perdieron su sentido y solo un lector crítico puede devolvérselo. Cada sala se abre con sus llaves. ¿Cómo te llamas?")}
<input id="nm" maxlength="24" placeholder="Tu nombre" autocomplete="given-name"><button class="btn" data-a="start">Entrar a la biblioteca</button></div>`}
function map(){const M=ROOMS[S.room],n=R().length;return `<h2>${M.n}</h2><p class="mute">${M.c}</p>
${say(IMG.bu,S.keys?"¡Muy bien, "+esc(S.name)+"! Sigue con el siguiente estante.":(S.room?"":"Bienvenido/a, "+esc(S.name)+". ")+M.say)}
${R().map((P,i)=>{const s=i<S.keys?"done":i===S.keys?"open":"lock";return `<button class="shelf ${s}" data-a="open" data-i="${i}" ${s!=="open"&&!S.dev?"disabled":""}><span class="spines">${SP}</span><b>${P.title}</b><small>${s==="done"?"Resuelto · "+P.key:s==="open"?P.sub:"Bloqueado: consigue la llave anterior"}</small></button>`}).join("")}
<button class="door ${S.note?"shake":""}" data-a="door"><div class="arch">${R().map((_,i)=>`<i class="kh ${i<S.keys?"on":""}"></i>`).join("")}</div><b>${S.room<ROOMS.length-1?"Puerta a la Sala "+(S.room+2):"Salida de la biblioteca"}</b><small>${S.note||(S.keys===n?"Toca para abrirla":"Necesita "+n+" llaves")}</small></button>`}
function intro(){const P=R()[S.p];return `<div class="card"><h2>${P.title}</h2><p>${P.mission}</p><a class="btn alt" href="${P.link}" target="_blank" rel="noopener noreferrer">${P.ll}</a><p class="rl">Se abre en otra pestaña. Cuando termines, regresa aquí.</p></div>
${say(IMG.bg,"<b>Tip de Clarín:</b> "+P.tip)}<button class="btn" data-a="go">Resolver los retos</button><button class="btn alt" data-a="back">Volver al mapa</button>`}
function widget(C){let h="";
if(C.t==="mc")h=C.o.map((o,i)=>`<button class="opt ${ch.done&&i===C.a?"good":ch.tried.includes(i)?"no":""}" data-a="opt" data-i="${i}" ${ch.done||ch.tried.includes(i)?"disabled":""}>${o}</button>`).join("");
if(C.t==="order"){h=`<div class="slots">${C.items.map((_,k)=>{const v=ch.sel[k];return v==null?`<div class="slot"><em>${k+1}</em></div>`:`<button class="slot f ${ch.done?"good":""}" data-a="rm" data-i="${k}" ${ch.done?"disabled":""}><em>${k+1}</em>${C.items[v]}</button>`}).join("")}</div><div class="chips">${ch.pool.filter(i=>!ch.sel.includes(i)).map(i=>`<button class="chip" data-a="add" data-i="${i}">${C.items[i]}</button>`).join("")}</div>`;
if(!ch.done)h+=`<div class="row"><button class="btn alt" data-a="rs" ${ch.sel.length?"":"disabled"}>Reiniciar</button><button class="btn" data-a="chk" ${ch.sel.length===C.items.length?"":"disabled"}>Comprobar</button></div>`}
if(C.t==="match")h=`<div class="grid">${C.pairs.map((p,i)=>`<button class="pair ${ch.ok.includes(i)?"ok":ch.pick===i?"pick":""}" data-a="mL" data-i="${i}">${p[0]}</button>`).join("")}${ch.rs.map(i=>`<button class="pair ${ch.ok.includes(i)?"ok":""}" data-a="mR" data-i="${i}">${C.pairs[i][1]}</button>`).join("")}</div>`;
return h}
function play(){const P=R()[S.p],C=cur(),last=S.c===P.ch.length-1;
const html=`<div class="dots">${P.ch.map((_,i)=>`<i class="${i<S.c?"on":i===S.c?"cur":""}"></i>`).join("")}</div><p class="mute">${P.title} · <a style="color:var(--gold)" href="${P.link}" target="_blank" rel="noopener noreferrer">${P.ll}</a></p>
${S.dev?`<div class="ans"><b>Respuesta correcta</b><br>${ans(C)}</div>`:""}<div class="card ${shk?"shake":""}"><p class="q">${C.q}</p>${widget(C)}
${ch.w&&!ch.done?`<p class="rl" style="color:var(--bad)">Aún no. Revisa el recurso e inténtalo de nuevo.</p>`:""}</div>
${ch.hint&&!ch.done?say(IMG.bg,"<b>Pista:</b> "+C.hint):""}
${ch.done?say(IMG.bu,`<b>+${ch.gain} puntos.</b> ${C.why}`,"ok")+`<button class="btn" data-a="next">${last?"Recoger la llave":"Siguiente reto"}</button>`:`<button class="btn alt" data-a="hint" ${S.hints&&!ch.hint?"":"disabled"}>💡 Pedir pista (${S.hints} restantes, −2 puntos)</button>`}${S.dev&&!ch.done?`<button class="btn alt" data-a="next">Saltar este reto (modo profe)</button>`:""}`;
shk=false;return html}
function keyscr(){const P=R()[S.p];return `<div class="keyscr"><div class="key">🔑</div><h2>${P.key}</h2><p>Encaja en la puerta de la sala. Llevas ${S.keys} de ${R().length}.</p><button class="btn" data-a="back">Volver al mapa</button></div>`}
function rdone(){return `<div class="end"><div class="key">🚪</div><h2>¡Sala ${S.room+1} abierta, ${esc(S.name)}!</h2><p>${S.pts} puntos hasta ahora</p>
${say(IMG.bu,"La puerta cede. "+(S.room===0?"Dominaste lo que el texto dice. Ahora toca ver cómo encajan sus partes.":"Ya sabes cómo se arma un texto. Falta lo más difícil: evaluarlo."))}
<button class="btn" data-a="nroom">Entrar a la Sala ${S.room+2}</button></div>`}
function end(){const pc=S.pts/MAX,n=pc>=.85?3:pc>=.6?2:1;return `<div class="end"><img src="${IMG.gr}" alt="Mascotas de Catalyst"><h2>¡Biblioteca restaurada, ${esc(S.name)}!</h2><div class="stars" aria-label="${n} de 3 estrellas">${"★".repeat(n)}${"☆".repeat(3-n)}</div><p><b>${S.pts} de ${MAX} puntos</b></p>
${say(IMG.bu,n===3?"Lees como quien entiende lo que el texto dice, cómo se arma y si se sostiene. Impecable.":n===2?"Buena lectura. Vuelve a las preguntas donde dudaste y revisa de nuevo el texto.":"Ya recuperaste la biblioteca. Juega otra vez apoyándote en los textos: la respuesta siempre está ahí.")}
<div class="card"><b>Para tu profe</b><p class="mute" style="margin:4px 0 0">Toma una captura de esta pantalla con tu nombre y tu puntaje.</p></div><button class="btn alt" data-a="again">Jugar de nuevo</button></div>`}
function render(){const v={cover,map,intro,play,key:keyscr,rdone,end,login,clave}[S.st];A.innerHTML=(S.st==="cover"||S.st==="login"?"":hud())+v()+foot();window.scrollTo(0,0)}
const acts={
start(){S.name=(document.getElementById("nm").value.trim()||"Lector/a");S.st="map"},
open(i){S.p=i;S.c=0;S.st="intro"},go(){S.st="play";initCh()},back(){S.st="map";S.note=""},
opt(i){if(ch.done||ch.tried.includes(i))return;if(i===cur().a)win();else{ch.w++;ch.tried.push(i);shk=true}},
add(i){ch.sel.push(i)},rm(k){ch.sel.splice(k,1)},rs(){ch.sel=[]},
chk(){if(ch.sel.every((v,k)=>v===k))win();else{ch.w++;ch.sel=[];shk=true}},
mL(i){if(!ch.ok.includes(i))ch.pick=i},
mR(i){if(ch.pick==null||ch.ok.includes(i))return;if(i===ch.pick){ch.ok.push(i);ch.pick=null;if(ch.ok.length===cur().pairs.length)win()}else{ch.w++;ch.pick=null;shk=true}},
hint(){if(S.hints>0&&!ch.hint&&!ch.done){S.hints--;ch.hint=true}},
next(){if(S.c<R()[S.p].ch.length-1){S.c++;initCh()}else{S.keys=Math.max(S.keys,S.p+1);S.st="key"}},
door(){if(S.keys===R().length)S.st=S.room<ROOMS.length-1?"rdone":"end";else S.note="Te faltan "+(R().length-S.keys)+" llave(s)"},
nroom(){S.room++;S.keys=0;S.hints=3;S.p=0;S.st="map"},
again(){const d=S.dev;reset();S.dev=d;S.st="cover"},
login(){S.prev=S.st;S.err="";S.st="login"},
devcheck(){const v=document.getElementById("pw").value;sha(v).then(h=>{if(h===PH){S.dev=true;S.err="";if(!S.name)S.name="Profe";S.st="map"}else S.err="Contraseña incorrecta.";render()}).catch(()=>{S.err="Este navegador no permite verificar la contraseña.";render()})},
devout(){S.dev=false;S.st="map"},
goroom(i){S.room=i;S.keys=0;S.hints=3;S.p=0;S.st="map"},
unlock(){S.keys=R().length;S.st="map"},
clave(){if(S.st!=="clave")S.prev=S.st;S.st="clave"},
closekey(){S.st=S.prev&&S.prev!=="login"&&S.prev!=="clave"?S.prev:(S.dev?"map":"cover")}};
A.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const f=acts[b.dataset.a];if(f){f(+b.dataset.i);render()}});
A.addEventListener("keydown",e=>{if(e.key!=="Enter")return;if(e.target.id==="pw")acts.devcheck();else if(e.target.id==="nm"){acts.start();render()}});
render();
</script></body></html>
